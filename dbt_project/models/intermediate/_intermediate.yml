version: 2
models:
  - name: int_flow_quarterly
    columns:
      - name: derivation
        data_tests:
          - accepted_values:
              arguments:
                values: ['direct', 'fy_minus_9m']
  - name: int_metrics_quarterly
    columns:
      - name: quarter_id
        data_tests: [unique, not_null]
      - name: cik
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_companies')
                field: cik
      - name: period_end
        data_tests: [not_null]
