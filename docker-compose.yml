services:
  evidence:
    image: node:22
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NPM_CONFIG_FETCH_RETRIES: "6"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "3000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "60000"
    volumes:
      - ./evidence:/app
      - evidence_modules:/app/node_modules
      - evidence_cache:/app/.evidence
    ports:
      - "3000:3000"
    command: ["sh", "-c", "npm install && npm run sources && npm run dev -- --host 0.0.0.0"]
volumes:
  evidence_modules:
  evidence_cache: